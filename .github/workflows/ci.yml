name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # The leak scan is the gate that must never be skipped or made optional.
      # This repository is public; curation by human attention fails silently,
      # and this is what makes it fail loudly instead. See scripts/leak-scan.ps1.
      # ---------------------------------------------------------------------
      - name: Leak scan
        shell: pwsh
        run: ./scripts/leak-scan.ps1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # ---------------------------------------------------------------------
      # Every refs/ folder must hold reference assemblies AND their .xml
      # documentation files. This is asserted rather than detected: an empty or
      # half-populated refs/ is a defect now, and the build step below would
      # otherwise be the only thing to notice - and it notices only the missing
      # .dll files, because a model compiles perfectly well with no docs at all.
      #
      # The .xml files are what an AI coding assistant reads to learn the
      # framework API. Losing them costs the repository its whole purpose while
      # leaving every build green, which is exactly the kind of silent failure
      # worth spending a CI step on.
      # ---------------------------------------------------------------------
      - name: Check refs folders
        shell: pwsh
        run: |
          $failed = $false
          foreach ($refs in @('refs', 'reference-model/DomainModelSample/refs')) {
            $dlls = @(Get-ChildItem $refs -Filter *.dll -ErrorAction SilentlyContinue)
            if ($dlls.Count -eq 0) {
              Write-Host "::error::$refs holds no assemblies."
              $failed = $true
              continue
            }
            $noDocs = @($dlls | Where-Object { -not (Test-Path (Join-Path $refs ($_.BaseName + '.xml'))) })
            if ($noDocs.Count -gt 0) {
              Write-Host "::error::$refs is missing XML documentation for: $($noDocs.BaseName -join ', ')"
              $failed = $true
              continue
            }
            Write-Host "$refs - $($dlls.Count) assemblies, all documented."
          }
          if ($failed) { exit 1 }

      - name: Build reference model
        run: >
          dotnet build reference-model/DomainModelSample/DomainModelSample.csproj
          -c Debug --no-incremental -warnaserror

      # ---------------------------------------------------------------------
      # The pattern library compiles. Every example in docs/patterns/ is a real
      # file in this project, so a framework change that invalidates a documented
      # pattern fails here rather than in a client's model - and an example that
      # no longer compiles is worse than no example, because it gets quoted with
      # confidence. The project already sets TreatWarningsAsErrors; -warnaserror
      # is belt and braces in case somebody removes it.
      # ---------------------------------------------------------------------
      - name: Build examples library
        run: >
          dotnet build examples/ExamplesLibrary/ExamplesLibrary.csproj
          -c Debug --no-incremental -warnaserror

      # ---------------------------------------------------------------------
      # jcass-dm's tests run on every push, on Linux, against a copy of the
      # reference model's bundle. They are the only thing standing between a
      # change here and a tool that quietly corrupts somebody's bundle - the
      # committed exe is rebuilt by hand, so CI cannot check the binary itself,
      # only the source it should have come from.
      # ---------------------------------------------------------------------
      - name: Test jcass-dm
        run: dotnet test tools/src/JcassDm.Tests/JcassDm.Tests.csproj --nologo --verbosity quiet

      # ---------------------------------------------------------------------
      # The committed exe must exist and must have a stamp beside it. It cannot
      # be run here (win-x64), and it can drift from tools/src without anything
      # noticing - the stamp records which commit it came from so that drift is
      # at least visible to a person.
      # ---------------------------------------------------------------------
      - name: Check jcass-dm is shipped
        shell: pwsh
        run: |
          foreach ($required in @('tools/jcass-dm.exe', 'tools/jcass-dm.build.txt')) {
            if (-not (Test-Path $required)) {
              Write-Host "::error::$required is missing. Rebuild with ./scripts/build-jcass-dm.ps1 and commit it."
              exit 1
            }
          }
          $size = [math]::Round((Get-Item 'tools/jcass-dm.exe').Length / 1MB, 1)
          Write-Host "tools/jcass-dm.exe - $size MB"
          Write-Host (Get-Content 'tools/jcass-dm.build.txt' -Raw)
