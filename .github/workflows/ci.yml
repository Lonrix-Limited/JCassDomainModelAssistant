name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # The leak scan is the gate that must never be skipped or made optional.
      # This repository is public; curation by human attention fails silently,
      # and this is what makes it fail loudly instead. See scripts/leak-scan.ps1.
      # ---------------------------------------------------------------------
      - name: Leak scan
        shell: pwsh
        run: ./scripts/leak-scan.ps1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # ---------------------------------------------------------------------
      # Every refs/ folder must hold reference assemblies AND their .xml
      # documentation files. This is asserted rather than detected: an empty or
      # half-populated refs/ is a defect now, and the build step below would
      # otherwise be the only thing to notice - and it notices only the missing
      # .dll files, because a model compiles perfectly well with no docs at all.
      #
      # The .xml files are what an AI coding assistant reads to learn the
      # framework API. Losing them costs the repository its whole purpose while
      # leaving every build green, which is exactly the kind of silent failure
      # worth spending a CI step on.
      # ---------------------------------------------------------------------
      - name: Check refs folders
        shell: pwsh
        run: |
          $failed = $false
          foreach ($refs in @('refs', 'reference-model/DomainModelSample/refs')) {
            $dlls = @(Get-ChildItem $refs -Filter *.dll -ErrorAction SilentlyContinue)
            if ($dlls.Count -eq 0) {
              Write-Host "::error::$refs holds no assemblies."
              $failed = $true
              continue
            }
            $noDocs = @($dlls | Where-Object { -not (Test-Path (Join-Path $refs ($_.BaseName + '.xml'))) })
            if ($noDocs.Count -gt 0) {
              Write-Host "::error::$refs is missing XML documentation for: $($noDocs.BaseName -join ', ')"
              $failed = $true
              continue
            }
            Write-Host "$refs - $($dlls.Count) assemblies, all documented."
          }
          if ($failed) { exit 1 }

      - name: Build reference model
        run: >
          dotnet build reference-model/DomainModelSample/DomainModelSample.csproj
          -c Debug --no-incremental -warnaserror
